[build]
  command = "npm run build:production"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# HTML and the release manifest must discover new releases immediately.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Source contains both hashed and unhashed copies; don't cache all JS forever.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Artwork filenames include content hashes and are safe to cache across releases.
[[headers]]
  for = "/public/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
